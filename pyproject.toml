[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-communication-rpc-framework"
version = "1.0.0"
description = "A beginner-friendly Python gRPC + A2A + MCP multi-agent framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "grpcio>=1.85,<2", "protobuf>=7.36.2,<8", "python-dotenv>=1,<2",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.85,<2", "pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
redis = ["redis>=5,<8"]

[tool.setuptools.packages.find]
include = ["agent_comm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: starts real local processes and sockets"]

